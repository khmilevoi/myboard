name: myboard

services:
  valkey:
    image: valkey/valkey:8-alpine
    # AOF so board data survives an unclean stop, not just periodic snapshots.
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    ports:
      # Host port is variable so a second stack (rpi deploy --env dev) can run
      # on the same Pi without fighting production for the bind. The default
      # keeps `pnpm start:docker` and the local tooling on 6379.
      - '127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      VALKEY_URL: redis://valkey:6379
      PORT: '8787'
      BROWSER_AUTOMATION_URL: http://browser-automation:8788
      BROWSER_AUTOMATION_TIMEOUT_MS: '100000'
      # WebAuthn / device-invite auth gate (Task 1.1). No secrets here;
      # credentials/sessions live in Valkey.
      #
      # Host-dependent: WebAuthn verifies the assertion origin against
      # EXPECTED_ORIGIN and scopes credentials to RP_ID, so a stack served on a
      # different hostname MUST override these or the gate rejects every
      # ceremony. Defaults are production; `rpi deploy --env dev` supplies the
      # dev hostname through .env.dev.
      RP_ID: ${RP_ID:-board.iiskelo.com}
      RP_NAME: ${RP_NAME:-MyBoard}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://board.iiskelo.com}
      EXPECTED_ORIGIN: ${EXPECTED_ORIGIN:-https://board.iiskelo.com}
      SESSION_TTL_SLIDING: 30d
      SESSION_TTL_ABSOLUTE: 90d
      TRUST_CF_CONNECTING_IP: '1'
      # Test seeding/reset endpoints for the nginx e2e suite. NEVER set in
      # production; empty/absent keeps them disabled.
      ALLOW_TEST_DB_RESET: ${ALLOW_TEST_DB_RESET:-}
    depends_on:
      valkey:
        condition: service_healthy
    expose:
      - '8787'
    healthcheck:
      # /api/time is the cheapest existing route; wget ships in busybox.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/api/time']
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      # default: reach valkey; browser_internal: reach browser-automation.
      - default
      - browser_internal

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      args:
        # Environment branding. `rpi` injects RPI_ENV for every `--env` deploy
        # and omits it entirely for production, and its agent applies the stack
        # env to `compose build` as well as to `up`, so this interpolates at
        # image-build time -- which is the only time it can, since the value is
        # baked into the bundle. An absent RPI_ENV means production, which
        # emits no branding at all.
        APP_ENV: '${RPI_ENV:-production}'
    depends_on:
      server:
        condition: service_healthy
    ports:
      # rpi publishes its own allocated host port for the ingress service on top
      # of this one; this entry exists for local `pnpm start:docker` and
      # `pnpm test:e2e:nginx`, which expect a predictable 8080. Variable so a
      # second stack on the same Pi can move it off production's bind.
      - '127.0.0.1:${CLIENT_HOST_PORT:-8080}:80'
    restart: unless-stopped

  browser-automation:
    build:
      context: .
      dockerfile: packages/browser-automation/Dockerfile
    init: true
    environment:
      PORT: '8788'
      # Non-secret operational config; Subproject 5 includes it in safe error meta.
      AUTOMATION_SSH_TARGET: ${AUTOMATION_SSH_TARGET:-}
      # Same variable as the noVNC publish line below, so a stack cannot set
      # one without the other: the container only ever sees its own internal
      # 6080 and has no way to introspect the host port Compose published it
      # under, so it must be told. Threaded into the recovery error meta the
      # widget reads to build its SSH-tunnel hint.
      NOVNC_HOST_PORT: ${NOVNC_HOST_PORT:-6080}
    secrets:
      - source: passport_number
        target: passport-checker_number
    expose:
      - '8788'
    ports:
      # noVNC only on the Raspberry Pi loopback; SSH is the access boundary.
      # The loopback bind is the invariant; the host port itself is variable so
      # a second stack on the same Pi gets its own.
      - '127.0.0.1:${NOVNC_HOST_PORT:-6080}:6080'
    volumes:
      - browser_profile:/profile
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # Only server needs to reach this service (see README diagnostics example);
    # client and valkey have no legitimate reason to, so browser-automation is
    # isolated on its own network instead of the shared default network.
    networks:
      - browser_internal
    # Chromium may still be mid-task (BROWSER_TASK_TIMEOUT_MS, default 60s) when
    # Compose stops the stack; give it enough time beyond that deadline plus
    # browser-context close/profile-flush overhead before SIGKILL lands.
    stop_grace_period: 75s

volumes:
  valkey_data:
  browser_profile:

networks:
  default:
  browser_internal:

secrets:
  passport_number:
    file: ./packages/widgets/passport-checker/secrets/number
