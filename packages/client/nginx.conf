# Auth-gate zones: keyed by the real client IP ($binary_remote_addr after the
# real_ip block below). A login ceremony is a burst of ~5 requests, so the
# auth zone gets a generous burst; pending-status polls every ~2s and gets its
# own zone so device-B polling never starves the auth endpoints.
limit_req_zone $binary_remote_addr zone=auth_zone:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pending_zone:1m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app can sit behind a host/pi ingress proxy before this nginx container.
    # Trust private-network proxy hops so $remote_addr becomes the real client
    # from X-Forwarded-For (cloudflared populates it) before rate limiting and
    # before /api requests are proxied to the Node server.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Runtime DNS resolver (Docker's embedded DNS) so a restarted `server`
    # container with a new IP is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s;
    set $upstream http://server:8787;
    # Garage's website endpoint (deploy/garage/garage.toml), read only by the
    # /files/ location below, after its per-blob auth check.
    set $files_upstream http://garage:3902;

    # ---- auth_request verifier -------------------------------------------
    # Every gated request triggers this subrequest. The verifier must always
    # see a bodyless GET regardless of the original request's method/body.
    # Cost, accepted knowingly: one extra Node+Valkey round-trip per gated
    # request — noise at this scale; if it ever hurts, proxy_cache on this
    # location keyed by the session cookie is the known escape hatch.
    location = /internal/auth {
        internal;
        proxy_pass $upstream/api/auth/session;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Per-blob verifier for /files/<blobId>: same bodyless GET as above, to a
    # Node route that checks the session AND the blob's recorded access rule.
    # A 204 carries the blob's Content-Disposition in x-file-disposition,
    # because Garage's website endpoint does not know it.
    location = /internal/files-auth {
        internal;
        proxy_pass $upstream/api/files/authorize;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---- public: activation app (static, ungated) ------------------------
    # The activation build ships with base /activate/ so its HTML and assets
    # all live under this prefix; unknown sub-paths fall back to its shell.
    location /activate/ {
        try_files $uri /activate/index.html;
    }

    location = /add-device {
        try_files /activate/index.html =404;
    }

    # ---- public: per-environment app icons (static, ungated) -------------
    # Generated files under packages/client/public/env/<name>/, referenced by
    # both the board's and the activation page's <link rel="icon">. The
    # activation page is served to unauthenticated visitors, so gating these
    # would make every one of them a 401 answered with the activation HTML
    # through error_page -- the browser would get text/html for a favicon and
    # the login screen of a stand would look exactly like production's.
    # Nothing here is secret: they are eight recoloured copies of icons that
    # already ship at the document root.
    location /env/ {
        try_files $uri =404;
    }

    # ---- public: auth API (rate limited, session checks live in Node) ----
    location = /api/auth/devices/pending-status {
        limit_req zone=pending_zone burst=10 nodelay;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=15 nodelay;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- public: e2e seeding (server-side dead without ALLOW_TEST_DB_RESET=1)
    location /api/test/ {
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- gated: widget server dispatch (extended read timeout) -----------
    # POST /api/widgets/:typeId/:event fans out to whatever a widget's own
    # server.ts handler does, and handlers vary wildly in how long they take.
    # passport-checker's browser-automation check is the slowest today, and
    # its own timeouts are layered as:
    #   client CHECK_DEADLINE_MS (95s, packages/widgets/passport-checker/model/check-model.ts)
    #     < board server BROWSER_AUTOMATION_TIMEOUT_MS (100s, packages/server/src/browser/config.ts)
    #     < this proxy_read_timeout (120s)
    # so the board server's own HTTP timeout is always what fires first, not
    # nginx's. Nginx's stock 60s default sits below both of those and would
    # 504 the request well before either, turning the intended timeout
    # wording into a generic error and stranding the deadline/salvage logic
    # in check-model.ts as dead code. This location is a longer prefix than
    # the generic /api/ block below, so nginx's longest-prefix-match rule
    # gives it precedence regardless of declaration order.
    location /api/widgets/ {
        auth_request /internal/auth;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- gated: file uploads ----------------------------------------------
    # Same gate as /api/ below; only the body cap differs. Node enforces each
    # slot's own policy (FILES_HARD_MAX_BYTES = 25 MiB at most); this is the
    # outer bound, a little above it so Node answers 413 with its own body.
    location /api/files/ {
        auth_request /internal/auth;
        client_max_body_size 26m;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- gated: everything else under /api -------------------------------
    location /api/ {
        auth_request /internal/auth;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- gated: recovery websocket ---------------------------------------
    # Exact match: it outranks the prefix /api/ block, which forwards no
    # Upgrade header and would drop an idle VNC session at its 60s read
    # timeout. The session gate still applies; the single-use capability
    # cookie is checked by Node on the upgrade.
    location = /api/browser/recovery/socket {
        auth_request /internal/auth;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above BROWSER_RECOVERY_MAX_SESSION_MS: the server owns expiry.
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        proxy_buffering off;
    }

    # ---- gated: file blobs, bytes straight from Garage ---------------------
    # Node never streams a read in production: the verifier above decides, and
    # nginx proxies the immutable object from Garage's website endpoint. Any
    # file type may be stored, so the headers are the ones the Node fallback
    # sends (blobResponseHeaders in packages/server/src/files/routes.ts) and
    # must stay in step with it: the stored Content-Type from Garage, never
    # sniffed, never run (sandboxed CSP), inline or attachment as recorded.
    #
    # Cache-Control is `private`, NEVER `public`: Cloudflare would cache the
    # file at the edge and hand it to anyone past the gate. Blob URLs are
    # immutable (a new upload is a new id), hence the year and `immutable`.
    #
    # auth_request passes only 2xx, 401 and 403 through; any other verifier
    # status (404 for an unknown or deleted blob, 503 before the Garage
    # bootstrap finished) becomes a 500. The verifier's own status is kept in
    # $files_auth_status and restored by @files_auth_failed.
    location ~ ^/files/(?<file_blob_id>[A-Za-z0-9_-]+)$ {
        limit_except GET {
            deny all;
        }
        auth_request /internal/files-auth;
        auth_request_set $file_disposition $upstream_http_x_file_disposition;
        auth_request_set $files_auth_status $upstream_status;
        error_page 500 = @files_auth_failed;

        proxy_pass $files_upstream/$file_blob_id;
        proxy_http_version 1.1;
        # The bucket is chosen by Host: `files` + the s3_web root_domain.
        proxy_set_header Host files.web.garage;
        # Garage needs neither the session cookie nor anything else of the caller's.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Amz-Request-Id;
        proxy_hide_header X-Amz-Id-2;
        proxy_hide_header X-Amz-Version-Id;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition $file_disposition always;
    }

    location @files_auth_failed {
        if ($files_auth_status = 404) {
            return 404;
        }
        if ($files_auth_status = 503) {
            return 503;
        }
        return 500;
    }

    # ---- gated: board statics (bare 401, no activation fallback) ---------
    location /assets/ {
        auth_request /internal/auth;
        try_files $uri =404;
    }

    # The host's own federation entry. Its URL never changes across releases
    # while its contents do — it names the hashed chunk that calls
    # createInstance — so an intermediary that caches it by URL will keep
    # serving the previous release's copy, whose chunk 404s in the new one. The
    # host then never initialises and EVERY loadRemote fails with
    # "#RUNTIME-009 Please call createInstance first", i.e. a board with no
    # widgets at all. Observed on 2026-07-26: Cloudflare served this file with
    # `cf-cache-status: HIT, age: 6503` under the default `max-age=14400`, from
    # a build almost three hours older than the deployed one.
    #
    # no-store, not no-cache: Cloudflare's zone Browser Cache TTL (default 4h)
    # rewrites any origin Cache-Control "shorter" than itself — no-cache
    # included — to `max-age=14400` on its way to the browser. The edge stopped
    # serving stale copies, but every browser kept the previous release's entry
    # in its HTTP disk cache for four hours; any load that reached the network
    # instead of the service worker (SW evicted or unregistered) then mixed two
    # builds in one federation share scope and crashed the host. Observed on
    # 2026-11-26 (`makeWidgetModules is not a function`). Cloudflare passes
    # no-store through untouched (cf-cache-status: BYPASS), and the service
    # worker's precache is unaffected: the Cache API ignores Cache-Control.
    location = /remoteEntry.js {
        auth_request /internal/auth;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Federation assets are real release files. Never fall back to index.html:
    # a missing remote/chunk must be a 404 so WidgetErrorBoundary gets a real
    # load failure instead of trying to parse the SPA shell as JavaScript.
    #
    # The same URL-stable-contents-change hazard as /remoteEntry.js above
    # applies to every widget's entry, hence the same no-store header.
    location ~ ^/widgets/[^/]+/remoteEntry\.js$ {
        auth_request /internal/auth;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Same URL-stable-contents-change hazard as /remoteEntry.js above: vite-plugin-pwa
    # emits the precache manifest under the fixed name /sw.js, and its contents change
    # every release. The browser's service-worker update algorithm sends a no-cache
    # request directive, but Cloudflare ignores that and keeps serving the previous
    # release's copy for hours, so clients stay pinned to stale precached assets.
    # no-store for the browser-TTL reason given at /remoteEntry.js above.
    location = /sw.js {
        auth_request /internal/auth;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location /widgets/ {
        auth_request /internal/auth;
        try_files $uri =404;
    }

    # ---- gated: SPA shell and navigations ---------------------------------
    # 401 here (and only here) serves the activation page in login mode; the
    # URL does not change and the status stays 401 (the rpi healthcheck
    # asserts exactly that — the deploy is healthy only if the door is locked).
    location / {
        auth_request /internal/auth;
        error_page 401 /activate/index.html;
        try_files $uri $uri/ /index.html;
    }
}
