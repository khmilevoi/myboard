schema = 1

[project]
name = "myboard"

[source]
repo = "git@github.com:khmilevoi/myboard.git"
branch = "main"

[build]
compose = "docker-compose.yml"

[ingress]
service = "client"
port = 80
expose = "lan"
hostname = "board.iiskelo.com"

[healthcheck]
# With the gate on, / answers 401 (activation page) for anonymous probes.
# Expecting 401 checks the whole nginx -> auth_request -> server -> Valkey
# chain AND that the door is locked: if the gate ever disappears, / returns
# 200 and the deploy fails as unhealthy.
path = "/"
expect = "401"
timeout = "60s"

# `env` and `files` are LOCAL push sources, not deploy-time inputs: the agent
# writes whatever the stored bundles hold. A `rpi secrets push --group <name>`
# stores the resolved `env` + `files` of the config it runs against, and both
# groups below are pushed from this base file — so anything added to `.env`
# reaches the non-production stacks too. Keep environment-specific values in
# .env.dev / .env.branch, which stay in their own per-environment bundles.
[secrets]
env = ".env"
files = [
  "packages/widgets/passport-checker/secrets/series",
  "packages/widgets/passport-checker/secrets/number",
]
# The passport files reach every stack through a secret group instead of being
# re-uploaded per environment: `prod` here, `dev` in rpi.dev.toml and
# rpi.branch.toml. Both carry the same values today; the split is what lets the
# non-production stacks be re-pointed at test values without touching
# production. Push both once, from the repository root:
#
#   rpi secrets push --group prod
#   rpi secrets push --group dev
#
# A declared group that was never pushed fails the deploy naming the group, so
# this has to happen before the next release. Verify with `rpi secrets ls`:
# the two file paths must show up as `<- group prod`.
groups = ["prod"]

# The Pi builds every widget remote, assembles the client PWA/nginx image, and
# builds the server image in one Compose release. Keep at least five minutes of
# observed headroom when this pipeline changes.
[timeouts]
build = "30m"

# create-invite needs Node + VALKEY_URL/PUBLIC_APP_URL, which only exist in the
# server container; ingress.service (client) is a bare nginx image.
[commands.create-invite]
run = "node dist/scripts/create-invite.cjs"
service = "server"

[commands.list-devices]
run = "node dist/scripts/list-devices.cjs"
service = "server"

[commands.list-invites]
run = "node dist/scripts/list-invites.cjs"
service = "server"

[commands.revoke-device]
run = "node dist/scripts/revoke-device.cjs"
service = "server"

[commands.revoke-devices]
run = "node dist/scripts/revoke-devices.cjs"
service = "server"

[commands.revoke-invite]
run = "node dist/scripts/revoke-invite.cjs"
service = "server"

[commands.prune-invites]
run = "node dist/scripts/prune-invites.cjs"
service = "server"

[commands.revoke-account]
run = "node dist/scripts/revoke-account.cjs"
service = "server"

[commands.mint-add-device-token]
run = "node dist/scripts/mint-add-device-token.cjs"
service = "server"

# Logical backup INSIDE the valkey_data volume: SAVE is synchronous (fine at
# this DB size), the dated copy survives FLUSHDB and bad deploys (files are
# not keys) — but not volume deletion. Restore = stop stack, copy a dump over
# /data/dump.rdb, start with AOF disabled once (or delete the AOF files).
[commands.backup]
run = "sh -c 'valkey-cli SAVE && mkdir -p /data/backups && cp /data/dump.rdb /data/backups/dump-$(date +%Y%m%d-%H%M%S).rdb && ls -lh /data/backups'"
service = "valkey"
